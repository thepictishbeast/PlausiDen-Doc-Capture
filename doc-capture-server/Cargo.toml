[package]
name = "doc-capture-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "axum HTTP server for PlausiDen-Doc-Capture. Exposes /health, /info, /capture endpoints wiring all pipeline stages."

[lib]
name = "doc_capture_server"
path = "src/lib.rs"

[[bin]]
name = "doc-capture-server"
path = "src/main.rs"

[dependencies]
doc-capture-core = { path = "../doc-capture-core" }
doc-capture-mrz = { path = "../doc-capture-mrz" }
doc-capture-aamva = { path = "../doc-capture-aamva" }
doc-capture-pdf417 = { path = "../doc-capture-pdf417" }

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true

[dev-dependencies]
image = "0.25"
rxing = "0.9"
tower = "0.5"
http-body-util = "0.1"
hyper = "1"
