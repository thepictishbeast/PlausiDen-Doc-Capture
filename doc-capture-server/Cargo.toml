[package]
name = "doc-capture-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "axum HTTP server for PlausiDen-Doc-Capture. Exposes /health, /info, /capture endpoints wiring all pipeline stages."

[features]
# `tesseract-cli` is ON BY DEFAULT so a plain `cargo build` produces a
# binary that CAN run real OCR (A3) — a feature-less build silently
# reverts the front-OCR/cross-check to the Mock engine, which was the
# original "front reads blank" bug. The feature only *compiles* the
# Tesseract CLI adapter (no build-time native dep); whether it is used
# is still a runtime choice via `DOC_CAPTURE_OCR_ENGINE` in `main.rs`,
# and it needs the `tesseract` binary on PATH at runtime. To build the
# pure-Mock variant (e.g. a host without tesseract): `--no-default-features`.
default = ["tesseract-cli"]
tesseract-cli = ["doc-capture-ocr/tesseract-cli"]

[lib]
name = "doc_capture_server"
path = "src/lib.rs"

[[bin]]
name = "doc-capture-server"
path = "src/main.rs"

[dependencies]
doc-capture-core = { path = "../doc-capture-core" }
doc-capture-mrz = { path = "../doc-capture-mrz" }
doc-capture-aamva = { path = "../doc-capture-aamva" }
doc-capture-pdf417 = { path = "../doc-capture-pdf417" }
doc-capture-ocr = { path = "../doc-capture-ocr" }
doc-capture-tamper = { path = "../doc-capture-tamper" }
doc-capture-face = { path = "../doc-capture-face" }

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true

[dev-dependencies]
image = "0.25"
rxing = "0.9"
tower = "0.5"
http-body-util = "0.1"
hyper = "1"
# E2e tests construct Mock fixtures + need core types directly.
doc-capture-core = { path = "../doc-capture-core" }
doc-capture-ocr = { path = "../doc-capture-ocr" }
doc-capture-face = { path = "../doc-capture-face" }
